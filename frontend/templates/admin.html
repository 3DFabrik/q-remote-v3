<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Remote V3 – Admin</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        :root {
            --panel: #b8b0a0;
            --panel-dark: #a09888;
            --panel-border: #706858;
            --panel-inner: #504840;
            --amber: #ffaa00;
            --phosphor: #00ff41;
            --red: #cc2200;
            --green: #00cc44;
            --white: #e8e0d0;
            --bg: #2a2520;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            padding: 20px;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
        }
        .container { max-width: 800px; margin: 0 auto; }
        .instrument-panel {
            background: var(--panel);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
            border: 2px solid var(--panel-border);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.3),
                inset 0 -1px 0 rgba(0,0,0,0.2),
                0 4px 12px rgba(0,0,0,0.5);
            position: relative;
        }
        .panel-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #504840;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        h1 {
            color: #504840;
            margin-bottom: 16px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-align: center;
        }
        h2 {
            color: var(--panel-inner);
            font-size: 0.75rem;
            margin: 16px 0 10px;
            border-bottom: 1px solid rgba(0,0,0,0.15);
            padding-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .nav { margin-bottom: 16px; text-align: center; }
        .nav a {
            color: var(--panel-inner);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .nav a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        th, td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            font-size: 0.8rem;
            color: #504840;
        }
        th {
            color: #706858;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        td input[type="text"], td input[type="password"] {
            background: var(--bg);
            border: 1px solid var(--panel-border);
            color: var(--phosphor);
            padding: 5px 8px;
            border-radius: 3px;
            width: 120px;
            font-size: 0.8rem;
            font-family: 'Share Tech Mono', monospace;
        }
        td input[type="checkbox"] { transform: scale(1.3); }
        .btn {
            padding: 5px 12px;
            border: 1px solid var(--panel-border);
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
        .btn-save { background: #504840; color: var(--amber); }
        .btn-delete { background: var(--red); color: white; }
        .btn-add { background: var(--panel-inner); color: var(--amber); padding: 8px 20px; font-size: 0.8rem; }
        .add-form {
            display: flex; gap: 8px; align-items: center; margin: 10px 0;
            background: rgba(0,0,0,0.08); padding: 12px; border-radius: 4px;
        }
        .add-form input {
            background: var(--bg);
            border: 1px solid var(--panel-border);
            color: var(--phosphor);
            padding: 7px;
            border-radius: 3px;
            font-family: 'Share Tech Mono', monospace;
        }
        .badge {
            background: var(--amber);
            color: #504840;
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 0.6rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="instrument-panel">
            <div class="panel-label">System Administration — Panel S1</div>
            <h1>🛡️ ADMIN CONTROL</h1>
            <div class="nav">
                <a href="/">◂ Radio</a>
                <a href="/admin/logs">📋 Logs</a>
                <a href="/admin/logs/download">⬇ Download</a>
                <a href="/logout">🚪 Logout</a>
            </div>

            <h2>Benutzer</h2>
            <table>
                <tr><th>Callsign</th><th>Passwort</th><th>Admin</th><th>Aktionen</th></tr>
                {% for username, data in users.items() %}
                <tr>
                    <form method="POST" action="/admin/users">
                        <td><strong>{{ username }}</strong> {% if data.admin %}<span class="badge">ADMIN</span>{% endif %}</td>
                        <td><input type="password" name="edit_password" placeholder="••••••" autocomplete="off"></td>
                        <td><input type="checkbox" name="edit_admin" {% if data.admin %}checked{% endif %}></td>
                        <td>
                            <input type="hidden" name="action" value="edit">
                            <input type="hidden" name="edit_username" value="{{ username }}">
                            <input type="hidden" name="del_username" value="{{ username }}">
                            <button type="submit" class="btn btn-save">SAVE</button>
                            {% if username != current_user %}
                            <button type="submit" class="btn btn-delete" onclick="this.form.action='/admin/users';this.form.elements.action.value='delete';this.form.elements.del_username.value='{{ username }}';return confirm('{{ username }} wirklich löschen?')">DEL</button>
                            {% endif %}
                        </td>
                    </form>
                </tr>
                {% endfor %}
            </table>

            <h2>Neuer Benutzer</h2>
            <form method="POST" action="/admin/users" class="add-form">
                <input type="hidden" name="action" value="add">
                <input type="text" name="new_username" placeholder="Callsign" required>
                <input type="password" name="new_password" placeholder="Passwort" required>
                <label><input type="checkbox" name="new_admin"> Admin</label>
                <button type="submit" class="btn btn-add">+ ADD</button>
            </form>
        </div>
    </div>
</body>
</html>
