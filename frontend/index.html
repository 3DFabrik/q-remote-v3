<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Remote V3</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Title Plate -->
        <header>
            <h1>Q-Remote V3</h1>
            <div class="status-indicator">
                <div id="status-light" class="status-light"></div>
                <span id="status">INIT</span>
            </div>
        </header>

        <!-- CRT Display Panel -->
        <div id="crt-bezel" class="instrument-panel">
            <div class="panel-label">Display — CRT Type 564</div>
            <div id="display-section">
                <canvas id="lcd" width="128" height="64"></canvas>
            </div>
        </div>

        <!-- S-Meter Panel -->
        <div class="instrument-panel">
            <div class="panel-label">Signal Strength — S-Meter</div>
            <div id="smeter">
                <div id="smeter-bar-track">
                    <div id="smeter-bar"></div>
                </div>
                <span id="smeter-value">S0 —</span>
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="instrument-panel">
            <div class="panel-label">Transmitter Control</div>
            <section id="controls">
                <!-- Function Keys -->
                <div class="control-row">
                    <button class="radio-btn func-key" data-key="10">F1</button>
                    <button class="radio-btn func-key" data-key="11">F2</button>
                    <button class="radio-btn func-key" data-key="12">F3</button>
                </div>

                <!-- Navigation -->
                <div class="control-row">
                    <button class="radio-btn nav-key" data-key="13">MENU</button>
                    <button class="radio-btn nav-key" data-key="19">EXIT</button>
                </div>

                <!-- Arrows -->
                <div class="control-row">
                    <button class="radio-btn arrow-key" data-key="14">▲</button>
                    <button class="radio-btn arrow-key" data-key="15">▼</button>
                </div>

                <!-- Numeric Keypad -->
                <div class="control-grid">
                    <button class="radio-btn" data-key="1">1</button>
                    <button class="radio-btn" data-key="2">2</button>
                    <button class="radio-btn" data-key="3">3</button>
                    <button class="radio-btn" data-key="4">4</button>
                    <button class="radio-btn" data-key="5">5</button>
                    <button class="radio-btn" data-key="6">6</button>
                    <button class="radio-btn" data-key="7">7</button>
                    <button class="radio-btn" data-key="8">8</button>
                    <button class="radio-btn" data-key="9">9</button>
                    <button class="radio-btn" data-key="0">0</button>
                </div>

                <!-- PTT -->
                <div id="ptt-container">
                    <button id="ptt-btn" class="ptt-button">TRANSMIT</button>
                </div>
                <div class="engraved">Push to Talk — Release to Listen</div>
            </section>
        </div>
    </div>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
