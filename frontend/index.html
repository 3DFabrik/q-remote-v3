<!DOCTYPE html>
<html lang="de">
<head><link rel="icon" type="image/png" href="/static/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Remote V3</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Title Plate -->
        <header>
            <div class=header-brand>
                <h1>Q-Remote V3</h1>
                <div class=status-indicator>
                    <div id=status-light class=status-light></div>
                    <span id=status>INIT</span>
                </div>
            </div>
            <div class=header-center>
                <span id=user-name></span>
            </div>
            <div class=header-buttons>
                <a href=/admin id=admin-btn class=hdr-btn style=display:none>
                    <span class="hdr-btn-icon audio-icon">&#9881;</span>
                    <span class=hdr-btn-label>ADMIN</span>
                </a>
                <a href=/logout id=logout-btn class=hdr-btn>
                    <span class="hdr-btn-icon audio-icon">&#x2190;</span>
                    <span class=hdr-btn-label>LOGOUT</span>
                </a>
                <button id=audio-btn class=hdr-btn title=Toggle RX Audio>
                    <span class="hdr-btn-icon audio-icon">&#x1f507;</span>
                    <span class="hdr-btn-label audio-label">AUDIO</span>
                </button>
            </div>
        </header>

        <!-- CRT Display Panel -->
        <div id="crt-bezel" class="instrument-panel">
            <div class="panel-label">Display — CRT Type 564</div>
            <div id="display-section">
                <canvas id="lcd" width="128" height="64"></canvas>
            </div>
        </div>

        <!-- S-Meter + PTT Panel -->
        <div class="instrument-panel">
            <div class="panel-label">Signal Strength — S-Meter</div>
            <div id="smeter-ptt-row">
                <div id="smeter">
                    <canvas id="smeter-canvas" width="260" height="80"></canvas>
                    <span id="smeter-value">S0 — dBm</span>
                </div>
                <div id="ptt-column">
                    <button id="ptt-btn" class="ptt-button">TRANSMIT</button>
                    <div class="engraved">Push to Talk</div>
                </div>
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="instrument-panel">
            <div class="panel-label">Transmitter Control</div>
            <section id="controls">
                <!-- Button Grid (4×4 like real UV-K5) -->
                <div class="control-grid">
                    <button class="radio-btn nav-key" data-key="10"><span class="btn-label">M</span><span class="btn-sub">🅐</span></button>
                    <button class="radio-btn arrow-key" data-key="11"><span class="btn-label">▲</span><span class="btn-sub">🅑</span></button>
                    <button class="radio-btn arrow-key" data-key="12"><span class="btn-label">▼</span><span class="btn-sub">🅒</span></button>
                    <button class="radio-btn nav-key btn-exit" data-key="13"><span class="btn-label">EXIT</span><span class="btn-sub">🅓</span></button>

                    <button class="radio-btn" data-key="1"><span class="btn-label">1</span><span class="btn-sub">BAND</span></button>
                    <button class="radio-btn" data-key="2"><span class="btn-label">2</span><span class="btn-sub">A/B</span></button>
                    <button class="radio-btn" data-key="3"><span class="btn-label">3</span><span class="btn-sub">VFO</span></button>
                    <button class="radio-btn" data-key="14"><span class="btn-label">✱</span><span class="btn-sub">SCAN</span></button>

                    <button class="radio-btn" data-key="4"><span class="btn-label">4</span><span class="btn-sub">FC</span></button>
                    <button class="radio-btn" data-key="5"><span class="btn-label">5</span><span class="btn-sub">SQL</span></button>
                    <button class="radio-btn" data-key="6"><span class="btn-label">6</span><span class="btn-sub">PWR</span></button>
                    <button class="radio-btn" data-key="0"><span class="btn-label">0</span><span class="btn-sub">FM</span></button>

                    <button class="radio-btn" data-key="7"><span class="btn-label">7</span><span class="btn-sub">W/N</span></button>
                    <button class="radio-btn" data-key="8"><span class="btn-label">8</span><span class="btn-sub">TDR</span></button>
                    <button class="radio-btn" data-key="9"><span class="btn-label">9</span><span class="btn-sub">CALL</span></button>
                    <button class="radio-btn btn-f" data-key="15"><span class="btn-label">F</span><span class="btn-sub">COMP</span></button>
                </div>

            </section>
        </div>
    </div>

    <script type="module" src="/static/js/app.js?v=4.2"></script>

<script>
(function() {
    if (window.CURRENT_USER) {
        document.getElementById("user-name").textContent = CURRENT_USER.name;
        if (CURRENT_USER.admin) {
            document.getElementById("admin-btn").style.display = "inline-block";
        }
    }
})();
</script>
</body>
</html>
