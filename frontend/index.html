<!DOCTYPE html>
<html lang="de">
<head><link rel="icon" type="image/png" href="/static/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Remote V3</title>
    <link rel="stylesheet" href="/static/css/style.css?v=6.7">
</head>
<body>
    <div id="app">
        <div class="equipment-chassis">
        <!-- Front plate (virtual chassis face) -->
        <header class="front-plate">
            <div class=header-brand>
                <h1>Q-Remote V3</h1>
                <div class="status-indicator">
                    <div class="link-leds">
                        <div class="link-led" title="Control (Socket.IO)">
                            <div id="led-io" class="status-light"></div>
                            <span>IO</span>
                        </div>
                        <div class="link-led" title="RX Audio WebSocket">
                            <div id="led-rx" class="status-light"></div>
                            <span>RX</span>
                        </div>
                        <div class="link-led" title="TX Audio WebSocket">
                            <div id="led-tx" class="status-light"></div>
                            <span>TX</span>
                        </div>
                    </div>
                    <span id="status">INIT</span>
                </div>
            </div>
            <div class=header-center>
                <span id=user-name></span>
            </div>
            <div class=header-buttons>
                <a href=/stations class=hdr-btn>
                    <span class="hdr-btn-icon audio-icon">&#x2637;</span>
                    <span class=hdr-btn-label>STATIONS</span>
                </a>
                <a href=/admin id=admin-btn class=hdr-btn style=display:none>
                    <span class="hdr-btn-icon audio-icon">&#9881;</span>
                    <span class=hdr-btn-label>ADMIN</span>
                </a>
                <a href=/logout id=logout-btn class=hdr-btn>
                    <span class="hdr-btn-icon audio-icon">&#x2190;</span>
                    <span class=hdr-btn-label>LOGOUT</span>
                </a>
                <button id=audio-btn class=hdr-btn title=Toggle RX Audio>
                    <span class="hdr-btn-icon audio-icon">&#x1f50a;</span>
                    <span class="hdr-btn-label audio-label">AUDIO</span>
                </button>
            </div>
        </header>

        <div class="module-bay">
        <!-- CRT Display Panel -->
        <div id="crt-panel" class="instrument-panel crt-panel module-insert">
            <div class="panel-label">Display — CRT Type 564</div>
            <div class="crt-bezel">
                <div id="display-section">
                    <canvas id="lcd" width="128" height="64"></canvas>
                </div>
            </div>
        </div>

        <!-- S-Meter + PTT Panel (GPIO strip under S-meter) -->
        <div class="instrument-panel smeter-panel module-insert">
            <div class="panel-label">Signal Strength — S-Meter</div>
            <div id="smeter-ptt-row">
                <div id="smeter-column">
                    <div id="smeter">
                        <canvas id="smeter-canvas" width="260" height="80"></canvas>
                    </div>
                    <div id="gpio-strip" class="gpio-strip" style="display:none;">
                        <div class="gpio-strip-inner">
                            <button id="gpio-btn-1" class="gpio-toggle-btn" style="display:none;" onclick="toggleGpioBtn('button1')">
                                <span class="gpio-btn-label"></span>
                            </button>
                            <button id="gpio-btn-2" class="gpio-toggle-btn" style="display:none;" onclick="toggleGpioBtn('button2')">
                                <span class="gpio-btn-label"></span>
                            </button>
                        </div>
                    </div>
                </div>
                <div id="ptt-column">
                    <div id="ptt-row" class="ptt-row">
                        <button id="tone-1750-btn" class="tone-1750-button" type="button" title="1750 Hz Repeater-Ton (einzeln antippen)" disabled>1750</button>
                        <button id="ptt-btn" class="ptt-button" type="button">PTT</button>
                    </div>
                    <div class="engraved">Push to Talk</div>
                    <div id="gpio-temp-display" class="gpio-temp-display"></div>
                    <div id="ptt-net-status" class="ptt-net-status"></div>
                </div>
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="instrument-panel module-insert">
            <div class="panel-label">Transmitter Control</div>
            <section id="controls">
                <!-- Button Grid (4×4 like real UV-K5) -->
                <div class="control-grid">
                    <button class="radio-btn nav-key" data-key="10"><span class="btn-label">MENU</span></button>
                    <button class="radio-btn arrow-key" data-key="11"><span class="btn-label">▲</span></button>
                    <button class="radio-btn arrow-key" data-key="12"><span class="btn-label">▼</span></button>
                    <button class="radio-btn nav-key btn-exit" data-key="13"><span class="btn-label">EXIT</span></button>

                    <button class="radio-btn" data-key="1"><span class="btn-label">1</span><span class="btn-sub">BAND</span></button>
                    <button class="radio-btn" data-key="2"><span class="btn-label">2</span><span class="btn-sub">A/B</span></button>
                    <button class="radio-btn" data-key="3"><span class="btn-label">3</span><span class="btn-sub">VFO/MR</span></button>
                    <button class="radio-btn" data-key="14"><span class="btn-label">✱</span><span class="btn-sub">SCAN</span></button>

                    <button class="radio-btn" data-key="4"><span class="btn-label">4</span><span class="btn-sub">FC</span></button>
                    <button class="radio-btn" data-key="5"><span class="btn-label">5</span><span class="btn-sub">NOAA</span></button>
                    <button class="radio-btn" data-key="6"><span class="btn-label">6</span><span class="btn-sub">H/M/L</span></button>
                    <button class="radio-btn" data-key="0"><span class="btn-label">0</span><span class="btn-sub">FM</span></button>

                    <button class="radio-btn" data-key="7"><span class="btn-label">7</span><span class="btn-sub">VOX</span></button>
                    <button class="radio-btn" data-key="8"><span class="btn-label">8</span><span class="btn-sub">R</span></button>
                    <button class="radio-btn" data-key="9"><span class="btn-label">9</span><span class="btn-sub">CALL</span></button>
                    <button class="radio-btn btn-f" data-key="15"><span class="btn-label">F</span><span class="btn-sub">🔒 #</span></button>
                </div>

            </section>
        </div>
        </div><!-- .module-bay -->
        </div><!-- .equipment-chassis -->
    </div>

    <script type="module" src="/static/js/app.js?v=5.0"></script>


<script>
(function() {
    if (window.CURRENT_USER) {
        document.getElementById("user-name").textContent = CURRENT_USER.name;
        if (CURRENT_USER.admin) {
            document.getElementById("admin-btn").style.display = "inline-block";
        }
    }
})();
</script>
<script>
    // ─── GPIO Button Bar ─────────────────────────────

    function countVisibleGpioButtons() {
        let visible = 0;
        for (const id of ['button1', 'button2']) {
            const btn = document.getElementById('gpio-btn-' + id.charAt(6));
            if (btn.style.display !== 'none') visible++;
        }
        return visible;
    }

    function updateGpioStripVisibility(visibleButtons) {
        const strip = document.getElementById('gpio-strip');
        const buttons = visibleButtons !== undefined ? visibleButtons : countVisibleGpioButtons();
        strip.style.display = buttons > 0 ? 'flex' : 'none';
    }

    async function loadGpioButtons() {
        try {
            const resp = await fetch('/api/gpio/buttons');
            if (!resp.ok) return;
            const data = await resp.json();
            const buttons = data.buttons || {};
            let visible = 0;

            for (const id of ['button1', 'button2']) {
                const btn = document.getElementById('gpio-btn-' + id.charAt(6));
                const info = buttons[id];
                if (info && info.label) {
                    btn.querySelector('.gpio-btn-label').textContent = info.label;
                    btn.style.display = 'flex';
                    btn.classList.toggle('active', !!info.active);
                    visible++;
                } else {
                    btn.style.display = 'none';
                }
            }

            updateGpioStripVisibility(visible);
        } catch(e) {
            console.warn('GPIO buttons load failed:', e);
        }
    }

    async function toggleGpioBtn(buttonId) {
        const btnNum = buttonId === 'button1' ? '1' : '2';
        const btn = document.getElementById('gpio-btn-' + btnNum);
        const isActive = btn.classList.contains('active');
        const newState = !isActive;

        try {
            const resp = await fetch('/api/gpio/button/' + buttonId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ active: newState })
            });
            if (resp.ok) {
                const data = await resp.json();
                btn.classList.toggle('active', newState);
            }
        } catch(e) {
            console.warn('GPIO button toggle failed:', e);
        }
    }

    // Load buttons after page init
    document.addEventListener('DOMContentLoaded', loadGpioButtons);

    // --- Temperature Display (auto, polls every 5s) ---
    var _tempPollTimer = null;

    function escHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    /** Fixed XX.X for Nixie window (2 digits + dot + 1 digit). */
    function formatNixieTemp(celsius) {
        if (celsius === null || celsius === undefined || Number.isNaN(celsius)) {
            return '\u2014.\u2010';
        }
        var sign = celsius < 0 ? '-' : '';
        var abs = Math.abs(celsius);
        var parts = abs.toFixed(1).split('.');
        var intPart = parts[0].padStart(2, '0');
        return sign + intPart + '.' + parts[1];
    }

    function renderTempModule(sensor) {
        var label = escHtml(sensor.name || 'TEMP');
        var digits = formatNixieTemp(sensor.temp);
        var errClass = (sensor.temp === null || sensor.temp === undefined) ? ' gpio-temp-nixie-off' : '';
        return (
            '<div class="gpio-temp-module">' +
                '<div class="gpio-temp-engraved">' + label + '</div>' +
                '<div class="gpio-temp-nixie-bezel">' +
                    '<span class="gpio-temp-nixie-digits' + errClass + '">' + digits + '</span>' +
                '</div>' +
            '</div>'
        );
    }

    async function loadTemperatures() {
        try {
            var resp = await fetch('/api/gpio/temperatures');
            if (!resp.ok) { return; }
            var data = await resp.json();
            var sensors = data.sensors || [];
            var display = document.getElementById('gpio-temp-display');

            _gpioBarHasTemps = sensors.length > 0;

            if (sensors.length === 0) {
                display.style.display = 'none';
                if (_tempPollTimer) { clearInterval(_tempPollTimer); _tempPollTimer = null; }
                display.innerHTML = '';
                return;
            }

            display.style.display = 'flex';
            display.innerHTML = sensors.map(renderTempModule).join('');
        } catch(e) {
            console.warn('Temperature load failed:', e);
        }
    }

    // Start polling on page load
    document.addEventListener('DOMContentLoaded', function() {
        loadTemperatures();
        _tempPollTimer = setInterval(loadTemperatures, 5000);
    });

    function updateGpioButtons(buttons) {
        let visible = 0;
        for (const id of ['button1', 'button2']) {
            const btn = document.getElementById('gpio-btn-' + id.charAt(6));
            const info = buttons[id];
            if (info && info.label) {
                btn.querySelector('.gpio-btn-label').textContent = info.label;
                btn.style.display = 'flex';
                btn.classList.toggle('active', !!info.active);
                visible++;
            } else {
                btn.style.display = 'none';
            }
        }
        updateGpioStripVisibility(visible);
    }
    </script>

</body>
</html>
