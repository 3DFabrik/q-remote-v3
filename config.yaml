# Q-Remote V3 Configuration
# Copy to config.local.yaml and adjust values for your setup.
# config.local.yaml is gitignored and will override defaults.

radio:
  device: "/dev/ttyACM0"
  baudrate: 38400
  timeout: 1.0
  reconnect_delay: 3.0        # seconds between reconnect attempts
  type: "uvk5"                # Radio type: "uvk5" (future: "hamlib")

audio:
  sample_rate: 8000
  channels: 1
  chunk_ms: 80                # milliseconds per audio chunk
  device_rx: "default"        # ALSA capture device
  device_tx: "default"        # ALSA playback device
  max_chunk_ms: 200           # adaptive: max chunk size on bad connections
  # RX noise gate (admin panel → config.local.yaml)
  squelch_enabled: true
  squelch_threshold: 300       # audio RMS (50=open … 5000=tight)
  squelch_signal_dbm: -115     # S-meter RSSI must exceed this (dBm)
  squelch_gate_hold_ms: 200    # close delay after signal/audio lost
  squelch_signal_stale_s: 0.5  # ignore RSSI older than this (seconds)

server:
  host: "0.0.0.0"
  port: 8080
  cors_origins: ["*"]

auth:
  jwt_secret: "CHANGE-ME-IN-PRODUCTION"   # override in config.local.yaml
  session_timeout_minutes: 120
  heartbeat_miss_seconds: 90      # GPIO session-bound: off after no heartbeat
  heartbeat_check_interval: 30    # watchdog poll interval
  users_file: "users.yaml"
  login_rate_limit:
    enabled: true
    max_attempts: 5               # failed logins per IP within window
    window_seconds: 900           # 15 minutes
    lockout_seconds: 900          # block IP for 15 minutes after limit hit
    delay_seconds: 0.75           # slow down each failed/blocked attempt
    trusted_proxies:              # use X-Forwarded-For when request comes from these
      - "127.0.0.1"
      - "::1"

logging:
  level: "DEBUG"               # DEBUG, INFO, WARNING, ERROR
  format: "text"              # "json" or "text"

# GPIO configuration (see docs/SPEC-GPIO.md)
# Pin definitions are managed via the admin API and persisted in config.local.yaml.
# This section only provides defaults; runtime config lives in config.local.yaml.
gpio:
  pins: []   # Empty = no GPIO pins configured
