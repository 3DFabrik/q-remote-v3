# Q-Remote V3 Configuration
# Copy to config.local.yaml and adjust values for your setup.
# config.local.yaml is gitignored and will override defaults.

radio:
  device: "/dev/ttyACM0"
  baudrate: 38400
  timeout: 1.0
  reconnect_delay: 3.0        # seconds between reconnect attempts
  type: "uvk5"                # Radio type: "uvk5" (future: "hamlib")

audio:
  sample_rate: 8000
  channels: 1
  chunk_ms: 80                # milliseconds per audio chunk
  device_rx: "default"        # ALSA capture device
  device_tx: "default"        # ALSA playback device
  max_chunk_ms: 200           # adaptive: max chunk size on bad connections

server:
  host: "0.0.0.0"
  port: 8080
  cors_origins: ["*"]

auth:
  jwt_secret: "CHANGE-ME-IN-PRODUCTION"   # override in config.local.yaml
  session_timeout_minutes: 120
  users_file: "users.yaml"

logging:
  level: "DEBUG"               # DEBUG, INFO, WARNING, ERROR
  format: "text"              # "json" or "text"
